[workspace]
resolver = "2"
members = ["crates/heartbit", "crates/heartbit-cli", "crates/heartbit-macro", "crates/heartbit-gateway", "crates/heartbit-core", "crates/heartbit-sensors", "crates/heartbit-telegram", "crates/heartbit-ghost", "crates/heartbit-tui"]

[workspace.package]
version = "2026.613.1"
authors = ["Pascal Le Clech <pascal@heartbit.ai>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/heartbit-ai/heartbit"
homepage = "https://github.com/heartbit-ai/heartbit"
documentation = "https://docs.rs/heartbit"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2", "charset", "stream", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
bytes = "1"
futures = "0.3"
toml = "0.8"
restate-sdk = "0.8"
clap = { version = "4", features = ["derive"] }
uuid = { version = "1", features = ["v4", "serde"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "json", "chrono", "uuid"] }
chrono = { version = "0.4", features = ["serde"] }
glob = "0.3"
jsonschema = "0.28"
opentelemetry = "0.28"
opentelemetry_sdk = { version = "0.28", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.28", features = ["grpc-tonic", "trace"] }
tracing-opentelemetry = "0.29"
walkdir = "2"
unicode-width = "0.2"
regex = "1"
a2a-sdk = "0.7.0"
rdkafka = { version = "0.37", features = ["cmake-build", "tokio"] }
axum = { version = "0.8", features = ["ws"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-util = "0.7"
cron = "0.13"
whatlang = "0.16"
pulldown-cmark = "0.12"
minijinja = { version = "2", features = ["json"] }
serde_yaml = "0.9"
slug = "0.1"
prometheus = { version = "0.14", default-features = false }
quick-xml = "0.37"
pgvector = { version = "0.4", features = ["sqlx"] }
hmac = "0.12"
sha1 = "0.10"
sha2 = "0.10"
hex = "0.4"
subtle = "2"
base64 = "0.22"
teloxide = { version = "0.17", features = ["macros"] }
dotenvy = "0.15"
fastembed = { version = "5" }
jsonwebtoken = "9"
petgraph = "0.7"
landlock = "0.4"
tokio-tungstenite = { version = "0.26", features = ["native-tls"] }
aes-gcm = "0.10"
argon2 = "0.5"
rand = "0.8"
tower = { version = "0.5", features = ["util"] }
syn = { version = "2", features = ["full", "extra-traits"] }
quote = "1"
proc-macro2 = "1"
parking_lot = "0.12"
libc = "0.2"
# `unstable-rendered-line-info` exposes `Paragraph::line_count(width)` so the
# transcript can auto-scroll by VISUAL (wrapped) rows, not logical lines.
ratatui = { version = "0.29", features = ["unstable-rendered-line-info"] }
crossterm = { version = "0.28", features = ["event-stream", "bracketed-paste"] }
# Deliberately NOT `default-fancy`: that bundles `plist-load`+`yaml-load`
# (source-grammar parsing our two call sites — SyntaxSet::load_defaults_newlines,
# ThemeSet::load_defaults — never touch, since they load pre-built embedded
# dumps) and drags in a duplicate `quick-xml` version alongside the workspace's
# existing one. This explicit set gives the same embedded-dump loading + the
# pure-Rust (no C toolchain) regex engine with 8 new crates, avoiding the
# `quick-xml` duplicate above (verified via `cargo tree -d`). It does NOT make
# the graph dupe-free: syntect still pulls its own `fancy-regex` major version
# (0.16.x) alongside jsonschema's (0.14.x). Do not "simplify" this back to
# `default-fancy`.
syntect = { version = "5", default-features = false, features = ["default-syntaxes", "default-themes", "regex-fancy"] }
