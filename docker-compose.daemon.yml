# Minimal PaaS-style compose — no Kafka, no Restate.
# Usage: docker compose -f docker-compose.daemon.yml up
services:
  heartbit:
    build: .
    ports:
      - "${PORT:-8080}:${PORT:-8080}"
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      PORT: ${PORT:-8080}
      RUST_LOG: ${RUST_LOG:-info}
      DATABASE_URL: postgres://heartbit:heartbit@postgres:5432/heartbit
    volumes:
      - ./heartbit.toml:/app/heartbit.toml:ro
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: heartbit
      POSTGRES_PASSWORD: heartbit
      POSTGRES_DB: heartbit
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U heartbit"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
