[book]
title = "The Heartbit Book"
description = "User guide for heartbit-core, the Rust agentic framework"
authors = ["Pascal Le Clech"]
language = "en"
src = "src"

[output.html]
default-theme = "light"
preferred-dark-theme = "navy"
git-repository-url = "https://github.com/heartbit-ai/heartbit"
edit-url-template = "https://github.com/heartbit-ai/heartbit/edit/main/book/{path}"
site-url = "/"

[output.html.search]
enable = true
limit-results = 30
use-boolean-and = true

[preprocessor.mermaid]
command = "mdbook-mermaid"

# mdbook-linkcheck 0.7.7 is incompatible with mdbook 0.5.x (RenderContext
# IPC schema changed; "missing field `sections`" error). Reinstate
# `[output.linkcheck]` once a compatible release lands. CI Task 2 covers
# basic build verification in the meantime.
