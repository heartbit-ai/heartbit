[package]
name = "heartbit-cli"
version.workspace = true
edition = "2024"
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "CLI for the Heartbit multi-agent runtime"
keywords = ["agent", "llm", "cli", "mcp", "ai"]

[[bin]]
name = "heartbit"
path = "src/main.rs"

[[bin]]
name = "heartbit_blog_render"
path = "src/bin/heartbit_blog_render.rs"

[dependencies]
heartbit = { path = "../heartbit", features = ["full"] }
heartbit-core = { path = "../heartbit-core" }
heartbit-ghost = { path = "../heartbit-ghost" }
heartbit-telegram = { path = "../heartbit-telegram" }
teloxide = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
clap = { workspace = true }
uuid = { workspace = true }
serde_json = { workspace = true }
reqwest = { workspace = true }
restate-sdk = { workspace = true }
opentelemetry = { workspace = true }
opentelemetry_sdk = { workspace = true }
opentelemetry-otlp = { workspace = true }
tracing-opentelemetry = { workspace = true }
axum = { workspace = true }
futures = { workspace = true }
tokio-stream = { workspace = true }
tokio-util = { workspace = true }
serde = { workspace = true }
chrono = { workspace = true }
prometheus = { workspace = true }
rdkafka = { workspace = true }
dotenvy = { workspace = true }
thiserror = { workspace = true }
base64 = { workspace = true }
sqlx = { workspace = true }
regex = { workspace = true }
# Runtime use: CLI-side `[daemon]` extension keys (e.g. cors_allow_origin) are
# parsed from the raw config file because heartbit-core's DaemonConfig cannot
# carry CLI-only fields.
toml = { workspace = true }

[features]
# SECURITY (F-FS-5): the `sandbox` feature is enabled by default on Linux
# so the kernel-level Landlock layer is active out of the box. Without this,
# `bash` runs with the host process's full capabilities — `cat /etc/passwd`,
# `find / -name '*.env'`, etc. The opt-out (`--no-default-features`) is for
# users who explicitly accept that risk. macOS and Windows have no Landlock
# equivalent; on those platforms, BashTool emits a `tracing::warn!` at build
# time so the user knows kernel sandboxing is unavailable.
default = ["sandbox"]
local-embedding = ["heartbit/local-embedding"]
daemon = ["heartbit/daemon"]
sandbox = ["heartbit/sandbox"]
