[package]
name = "heartbit-core"
version.workspace = true
edition = "2024"
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/heartbit-core"
description = "The Rust agentic framework — agents, tools, LLM providers, memory, evaluation."
readme = "README.md"
keywords = ["agent", "llm", "mcp", "ai", "framework"]
categories = ["development-tools", "asynchronous"]

[dependencies]
# Empirical-deps pattern: add a dep here only when a subsequent move-task's
# `cargo check -p heartbit-core` fails with "unresolved import". Start minimal.
anyhow = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
reqwest = { workspace = true, features = ["multipart"] }
subtle = { workspace = true }
tokio-util = { workspace = true }
bytes = { workspace = true }
futures = { workspace = true }
uuid = { workspace = true }
base64 = { workspace = true }
glob = { workspace = true }
regex = { workspace = true }
walkdir = { workspace = true }
jsonschema = { workspace = true }
hmac = { workspace = true }
sha1 = { workspace = true }
sha2 = { workspace = true }
chrono = { workspace = true }
toml = { workspace = true }
petgraph = { workspace = true }
parking_lot = { workspace = true }
a2a-sdk = { workspace = true, optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
landlock = { workspace = true, optional = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[dev-dependencies]
tempfile = "3"
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }
wiremock = "0.6"

[features]
default = []
a2a = ["dep:a2a-sdk"]
# Features inherited from tool/ (gated conditionals in code)
sandbox = ["dep:landlock"]
# Mirror umbrella's `sensor` feature so cfg-gated items
# (`agent::guardrails::sensor_security`) compile when the umbrella enables it.
sensor = []
# Exposes selected crate-internal types for criterion benchmarks under
# `crates/heartbit-core/benches/`. Enabled automatically when running
# `cargo bench`; should not be enabled by downstream consumers.
bench-internals = []

[[bench]]
name = "memory_recall"
harness = false

[[bench]]
name = "guardrail_pii"
harness = false

[[bench]]
name = "sse_parse"
harness = false
required-features = ["bench-internals"]

[[bench]]
name = "agent_react_turn"
harness = false
required-features = ["bench-internals"]
